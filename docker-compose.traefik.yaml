name: garage
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: cloudlena/s3manager:latest
    container_name: garage-manager
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      USE_SSL: "false"
      ENDPOINT: garage-server:3900
      ACCESS_KEY_ID: ${S3_ACCESS_KEY:-replace-with-a-random-password}
      SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-replace-with-a-random-password}
      CONTAINER_NAME: garage-manager
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '8080']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      - garage-server
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.garage-manager.entrypoints=http'
      - 'traefik.http.routers.garage-manager.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.garage-manager.middlewares=garage-manager-https-redirect'
      - 'traefik.http.middlewares.garage-manager-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.garage-manager-secure.entrypoints=https'
      - 'traefik.http.routers.garage-manager-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.garage-manager-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.garage-manager-secure.service=garage-manager'
      - 'traefik.http.services.garage-manager.loadbalancer.server.port=8080'
    networks:
      - garage
      - traefik

  garage-server:
    image: dxflrs/garage:latest
    container_name: garage-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: garage-server
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      RUST_LOG: garage=info
      GARAGE_ADMIN_TOKEN: ${DB_ADMIN_PASS:-replace-with-a-random-password}
      GARAGE_METRICS_TOKEN: ${APP_API_TOKEN:-replace-with-a-random-password}
      GARAGE_RPC_SECRET: ${RPC_SECRET:-replace-with-a-random-password}
      CONTAINER_NAME: garage-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './config/garage.toml:/etc/garage.toml:ro'
      - './volumes/data/garage:/var/lib/garage/data'
      - './volumes/config/garage:/var/lib/garage/meta'
    networks:
      - garage

networks:
  garage:
    name: garage
    external: false
  traefik:
    external: true
