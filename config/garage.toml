db_engine = "lmdb"
data_dir = "/var/lib/garage/data"
metadata_dir = "/var/lib/garage/meta"

replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
compression_level = 2

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain = "example.com"

[s3_web]
bind_addr = "[::]:3902"
root_domain = "storage.example.com"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"

[k2v_api]
api_bind_addr = "[::]:3904"
